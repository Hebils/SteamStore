<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gamix | Crear cuenta</title>
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/auth.css" />
        <script type="module" src="/src/pages/register.js"></script>
    </head>

    <body>
        <a class="skip-link" href="#auth-content">Saltar al formulario</a>
        <main class="auth-window" id="auth-content">
            <header class="auth-bar">
                <a href="/store"
                    ><span class="prompt">root@gamix:~$</span> GAMIX_</a
                ><span>register.exe</span>
            </header>
            <section class="auth-content">
                <a class="back-link" href="/store">Volver a la tienda</a>
                <p class="terminal-line">
                    <span class="prompt">&gt;</span> ./crear-cuenta
                </p>
                <h1 class="form-title">
                    Crear cuenta<span class="cursor">_</span>
                </h1>
                <p class="auth-note">Crea tu usuario para entrar a Gamix.</p>
                <form id="registro-form">
                    <div class="field">
                        <label for="nombre">Nombre de usuario</label
                        ><input
                            id="nombre"
                            name="nombre"
                            type="text"
                            autocomplete="name"
                            maxlength="100"
                            required
                            placeholder="Ej: Mario64"
                        />
                    </div>
                    <div class="field">
                        <label for="correo">Correo electr&oacute;nico</label
                        ><input
                            id="correo"
                            name="email"
                            type="email"
                            autocomplete="email"
                            maxlength="150"
                            required
                            placeholder="Ej: carlos@gmail.com"
                        />
                    </div>
                    <div class="field">
                        <label for="password">Contrase&ntilde;a</label
                        ><input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            aria-describedby="password-help"
                            required
                        /><small id="password-help" class="field-help"
                            >Utiliza al menos 8 caracteres.</small
                        ><button
                            type="button"
                            class="password-toggle"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            Mostrar contraseña
                        </button>
                    </div>
                    <button class="btn-primary" type="submit">
                        Crear cuenta
                    </button>
                </form>
                <p
                    id="mensaje"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>
                <p class="auth-link">
                    &iquest;Ya tienes cuenta?
                    <a href="/login">Iniciar sesión</a>
                </p>
            </section>
        </main>
    </body>
</html>
