<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamix | Iniciar sesi&oacute;n</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/auth.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/loginusuario.js" defer></script>
</head>
<body>
    <main class="auth-window">
        <header class="auth-bar">
            <a href="/store"><span class="prompt">root@gamix:~$</span> GAMIX_</a>
            <span>login.exe</span>
        </header>
        <section class="auth-content">
            <a class="back-link" href="/store">&larr; Volver a la tienda</a>
            <p class="terminal-line"><span class="prompt">&gt;</span> ./login</p>
            <h1 class="form-title">Iniciar sesi&oacute;n<span class="cursor">_</span></h1>
            <p class="auth-note">Ingresa tus datos para continuar.</p>
            <p id="registro-notice" class="form-message" role="status" hidden></p>
            <form id="login-form">
                <div class="field">
                    <label for="correo">Correo electr&oacute;nico</label>
                    <input type="email" id="correo" name="email" autocomplete="email" required placeholder="Ej: carlos@gmail.com">
                    <small class="field-help">Usa el correo asociado a tu cuenta.</small>
                </div>
                <div class="field">
                    <label for="password">Contrase&ntilde;a</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn-primary" type="submit">$ acceder</button>
            </form>
            <p id="mensaje" class="form-message" role="status" aria-live="polite"></p>
            <p class="auth-link">&iquest;A&uacute;n no tienes cuenta? <a href="/register">./crear-cuenta</a></p>
        </section>
    </main>
</body>
</html>
