<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamix | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="js/api.js" defer></script>
    <script src="js/loginusuario.js" defer></script>
</head>

<body>
    <main class="auth-window">
        <header class="auth-bar">
            <a href="index.html"><span class="prompt">root@gamix:~$</span> GAMIX_</a>
            <span>login.exe</span>
        </header>
        <section class="auth-content">
            <p class="terminal-line"><span class="prompt">&gt;</span> ./login</p>
            <h1 class="form-title">Iniciar sesión<span class="cursor">_</span></h1>
            <p class="auth-note">Ingresa tus datos para continuar.</p>

            <form id="login-form">
                <div class="field">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn-primary" type="submit">$ acceder</button>
            </form>
            <p id="mensaje" class="form-message" role="status" aria-live="polite"></p>
            <p class="auth-link">¿Aún no tienes cuenta? <a href="Registro.html">./crear-cuenta</a></p>
        </section>
    </main>
</body>

</html>
