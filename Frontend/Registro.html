<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamix | Crear cuenta</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="js/api.js" defer></script>
    <script src="js/registro.js" defer></script>
</head>

<body>
    <main class="auth-window">
        <header class="auth-bar">
            <a href="index.html"><span class="prompt">root@gamix:~$</span> GAMIX_</a>
            <span>register.exe</span>
        </header>
        <section class="auth-content">
            <a class="back-link" href="index.html">← Volver a la tienda</a>
            <p class="terminal-line"><span class="prompt">&gt;</span> ./crear-cuenta</p>
            <h1 class="form-title">Crear cuenta<span class="cursor">_</span></h1>
            <p class="auth-note">Crea tu usuario para entrar a Gamix.</p>

            <form id="registro-form">
                <div class="field">
                    <label for="nombre">Nombre de usuario</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" maxlength="100"
                        placeholder="Ej: Mario64" required>
                </div>
                <div class="field">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="email" autocomplete="email" maxlength="150"
                        placeholder="Ej: carlos@gmail.com" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8"
                        aria-describedby="password-help" required>
                    <small id="password-help" class="field-help">Utiliza al menos 8 caracteres.</small>
                </div>
                <button class="btn-primary" type="submit">$ crear-usuario</button>
            </form>
            <p id="mensaje" class="form-message" role="status" aria-live="polite"></p>
            <p class="auth-link">¿Ya tienes cuenta? <a href="Login.html" id="login-link">./iniciar-sesion</a></p>
        </section>
    </main>
</body>

</html>
