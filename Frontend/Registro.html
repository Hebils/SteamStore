<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamix_ Registro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/resgistrousuario.js"></script>
</head>

<body>

    <!-- Capas de fondo -->
    <div class="bg-layer"></div>
    <div class="bg-grid"></div>
    <div class="bg-lines"></div>
    <div class="particles" id="particles"></div>
    <div class="bg-watermark">GAMIX</div>

    <!-- =================== TARJETA =================== -->
    <div class="card">

        <!-- Lado izquierdo: formulario -->
        <div class="card-form">

            <!-- Logo -->
            <div class="brand">
                <div class="logo-circle">
                    <img src="../img/logo.png" alt="Logo" width="80" height="80">
                </div>
            </div>

            <p class="form-title">Crear Cuenta</p>
            <div class="form-divider"></div>

            <!-- Campo: Nombre completo -->
            <div class="field">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Nombre" />
            </div>

            <!-- Campo: Usuario -->
            <div class="field">
                <label for="usuario">Nombre de Usuario</label>
                <input type="text" id="usuario" placeholder="Ej: gamerpro" />
            </div>

            <!-- Campo: Correo -->
            <div class="field">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Correo@ejemplo.com" />
            </div>

            <!-- Campo: ContraseÃ±a -->
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" />
            </div>

            <!-- BotÃ³n -->
            <button class="btn-primary" onclick="registrarse()">CREAR CUENTA</button>

            <!-- Mensaje que responde el backend -->
            <p id="mensaje"></p>

            <!-- Link al login -->
            <div class="login-link">
                ¿Ya tienes cuenta?
                <a href="Login.html">Inicia sesión aquí</a>
            </div>

        </div>

        <!-- Lado derecho: imagen decorativa -->
        <div class="card-image">
            <!--
        CÓMO PONER TU IMAGEN:
        1. Elimina el div .img-placeholder
        2. En .card-image (CSS) agrega:
             background-image: url('tu-imagen.jpg');
             background-size: cover;
             background-position: center;
      -->

        </div>

    </div>


</body>

</html>
